
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Tours</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>

    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand text-uppercase" href="#">
                Aurora Tours
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Packages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">FAQ</a>
                    </li>
                </ul>
            </div>

        </div>
    </nav>

    <main>

        <div id="hero-carousel" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active c-item">
                    <img src="https://images.unsplash.com/photo-1531366936337-7c912a4589a7"
                        class="d-block w-100 c-img" alt="Northern lights">
                </div>

                <div class="carousel-item c-item">
                    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                        class="d-block w-100 c-img" alt="Mountain landscape">
                </div>

                <div class="carousel-item c-item">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                        class="d-block w-100 c-img" alt="Beautiful lake">
                </div>

            </div>

        </div>

    </main>

</body>
</html>
