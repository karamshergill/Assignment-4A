
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Tours</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>

    <!-- Navigation -->

    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand text-uppercase" href="#">
                Aurora Tours
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">Packages</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">FAQ</a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <main>

        <!-- Booking Modal -->

        <div class="modal fade" id="booking-modal"
            tabindex="-1"
            aria-labelledby="booking-modal-label"
            aria-hidden="true">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header">

                        <h1 class="modal-title fs-5" id="booking-modal-label">
                            Book a tour
                        </h1>

                        <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                        </button>

                    </div>

                    <div class="modal-body">

                        <form>

                            <div class="row g-2">

                                <!-- Email Field -->

                                <div class="col-sm-6">

                                    <div class="form-floating">

                                        <input type="email"
                                            class="form-control"
                                            id="email1"
                                            placeholder="Email address">

                                        <label for="email1">
                                            Email address
                                        </label>

                                    </div>

                                </div>

                                <!-- Tour Selection -->

                                <div class="col-sm-6">

                                    <div class="form-floating">

                                        <select class="form-select" id="select1">

                                            <option value="1">
                                                Northern Lights Tour
                                            </option>

                                            <option value="2">
                                                Mountain Adventures
                                            </option>

                                            <option value="3">
                                                Beautiful Journeys
                                            </option>

                                        </select>

                                        <label for="select1">
                                            Pick a tour
                                        </label>

                                    </div>

                                </div>

                            </div>

                        </form>

                    </div>

                    <div class="modal-footer">

                        <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                            Close
                        </button>

                        <button type="button"
                            class="btn btn-primary">
                            Checkout
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Hero Carousel -->

        <div id="hero-carousel" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-indicators">

                <button type="button"
                    data-bs-target="#hero-carousel"
                    data-bs-slide-to="0"
                    class="active"
                    aria-current="true"
                    aria-label="Slide 1">
                </button>

                <button type="button"
                    data-bs-target="#hero-carousel"
                    data-bs-slide-to="1"
                    aria-label="Slide 2">
                </button>

                <button type="button"
                    data-bs-target="#hero-carousel"
                    data-bs-slide-to="2"
                    aria-label="Slide 3">
                </button>

            </div>

            <div class="carousel-inner">

                <!-- First Slide -->

                <div class="carousel-item active c-item">

                    <img src="https://images.unsplash.com/photo-1531366936337-7c912a4589a7"
                        class="d-block w-100 c-img"
                        alt="Northern lights">

                    <div class="carousel-caption top-0 mt-4">

                        <p class="mt-5 fs-3 text-uppercase">
                            Discover the hidden world
                        </p>

                        <h1 class="display-1 fw-bolder text-capitalize">
                            Aurora Tours
                        </h1>

                        <button type="button"
                            class="btn btn-primary px-4 py-2 fs-5 mt-5"
                            data-bs-toggle="modal"
                            data-bs-target="#booking-modal">
                            Book a tour
                        </button>

                    </div>

                </div>

                <!-- Second Slide -->

                <div class="carousel-item c-item">

                    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                        class="d-block w-100 c-img"
                        alt="Mountain landscape">

                    <div class="carousel-caption top-0 mt-4">

                        <p class="mt-5 fs-3 text-uppercase">
                            Explore amazing destinations
                        </p>

                        <h2 class="display-1 fw-bolder text-capitalize">
                            Mountain Adventures
                        </h2>

                        <button type="button"
                            class="btn btn-primary px-4 py-2 fs-5 mt-5"
                            data-bs-toggle="modal"
                            data-bs-target="#booking-modal">
                            Book a tour
                        </button>

                    </div>

                </div>

                <!-- Third Slide -->

                <div class="carousel-item c-item">

                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                        class="d-block w-100 c-img"
                        alt="Beautiful lake">

                    <div class="carousel-caption top-0 mt-4">

                        <p class="mt-5 fs-3 text-uppercase">
                            Experience the beauty of nature
                        </p>

                        <h2 class="display-1 fw-bolder text-capitalize">
                            Beautiful Journeys
                        </h2>

                        <button type="button"
                            class="btn btn-primary px-4 py-2 fs-5 mt-5"
                            data-bs-toggle="modal"
                            data-bs-target="#booking-modal">
                            Book a tour
                        </button>

                    </div>

                </div>

            </div>

            <!-- Previous Button -->

            <button class="carousel-control-prev" type="button"
                data-bs-target="#hero-carousel"
                data-bs-slide="prev">

                <span class="carousel-control-prev-icon"
                    aria-hidden="true"></span>

                <span class="visually-hidden">Previous</span>

            </button>

            <!-- Next Button -->

            <button class="carousel-control-next" type="button"
                data-bs-target="#hero-carousel"
                data-bs-slide="next">

                <span class="carousel-control-next-icon"
                    aria-hidden="true"></span>

                <span class="visually-hidden">Next</span>

            </button>

        </div>

        <!-- Overview Section -->

        <section class="overview">

            <div class="container h-100 d-flex align-items-center">

                <div class="row w-100 text-center fs-4 gy-3">

                    <div class="col-xl">

                        <i class="bi bi-airplane-fill me-2"></i>
                        3 amazing destinations

                    </div>

                    <div class="col-xl">

                        <i class="bi bi-wallet-fill me-2"></i>
                        Only pay 5% up front

                    </div>

                    <div class="col-xl">

                        <i class="bi bi-patch-check-fill me-2"></i>
                        100% guaranteed

                    </div>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
